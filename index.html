<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNAPY Member Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#1b1a17; --muted:#6f6a60; --line:#e3ddd0;
  --accent:#e4572e; --accent-ink:#fff; --ok:#1f8a5b; --ok-bg:#e6f4ec; --warn:#b4471f; --warn-bg:#fbe9e2;
  --tp:#2c6e9b; --tp-bg:#e3eef6; --pik:#7a4fb0; --pik-bg:#efe7f8;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(40,30,10,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15140f; --card:#1f1d18; --ink:#f1ede4; --muted:#a39d90; --line:#34312a;
  --accent:#ff6b42; --ok:#5fd09a; --ok-bg:#163326; --warn:#ff9a76; --warn-bg:#3a1f15;
  --tp:#7cb8e2; --tp-bg:#18303f; --pik:#c4a2ef; --pik-bg:#2c1f3d; --shadow:none;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:18px}
.brand b{display:block;font-size:17px;letter-spacing:.02em}
.brand span{font-size:12.5px;color:var(--muted)}
.outlets{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px}
.pill.tp{background:var(--tp-bg);color:var(--tp)} .pill.pik{background:var(--pik-bg);color:var(--pik)}

.search{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.search label{display:block;font-weight:700;font-size:15px;margin-bottom:4px}
.search p{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.row{display:flex;gap:10px}
.field{flex:1;display:flex;align-items:center;border:2px solid var(--line);border-radius:12px;background:var(--bg);transition:border-color .15s}
.field:focus-within{border-color:var(--accent)}
.field svg{margin-left:14px;flex:none;color:var(--muted)}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:600 22px "JetBrains Mono",monospace;letter-spacing:.04em;padding:14px 12px;outline:none}
.field input::placeholder{color:var(--muted);opacity:.55;font-weight:500}
.btn{border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:700 16px inherit;font-family:inherit;padding:0 22px;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:600;font-size:13px;padding:8px 12px}
.hint{margin-top:10px;font-size:12px;color:var(--muted)}
kbd{font-family:"JetBrains Mono",monospace;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px}

#result{margin-top:20px}
.status{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;font-weight:700;font-size:15px;margin-bottom:12px}
.status.ok{background:var(--ok-bg);color:var(--ok)} .status.no{background:var(--warn-bg);color:var(--warn)}
.status small{font-weight:500;opacity:.85}
.member{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);margin-bottom:12px;}
.mtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.mname{font-size:24px;font-weight:800;line-height:1.2;margin:0}
.mcode{font:500 12.5px "JetBrains Mono",monospace;color:var(--muted);margin-top:4px}
.badge{flex:none;font-size:13px;font-weight:700;padding:7px 12px;border-radius:10px;white-space:nowrap}
.badge.tp{background:var(--tp-bg);color:var(--tp)} .badge.pik{background:var(--pik-bg);color:var(--pik)} .badge.other{background:var(--line);color:var(--muted)}
dl{margin:0;display:grid;grid-template-columns:130px 1fr;row-gap:12px;column-gap:16px;border-top:1px dashed var(--line);padding-top:16px}
dt{color:var(--muted);font-size:13px;font-weight:600;padding-top:2px}
dd{margin:0;font-size:15.5px;line-height:1.45}
dd.phone{font:600 18px "JetBrains Mono",monospace;letter-spacing:.03em}
.empty{text-align:center;color:var(--muted);padding:36px 16px;font-size:14px}
.empty svg{opacity:.5;margin-bottom:8px}

footer{margin-top:28px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
#file{display:none}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:520px){
  .row{flex-direction:column} .btn{padding:14px} .field input{font-size:19px}
  dl{grid-template-columns:1fr;row-gap:4px} dd{margin-bottom:10px}
  .mtop{flex-direction:column} header{flex-direction:column;align-items:flex-start}
}
.pin{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.pin label{display:block;font-weight:700;font-size:15px;margin-bottom:4px}
.pin p{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.pin .err{color:var(--warn);font-size:13px;font-weight:600;margin-top:10px;min-height:1em}
.hidden{display:none!important}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:600;padding:12px 4px}
.spin{width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">S</div>
      <div><b>SNAPY Member Checker</b><span>Promo khusus member outlet kami</span></div>
    </div>
    <div class="outlets"><span class="pill tp">Taman Palem</span><span class="pill pik">PIK</span></div>
  </header>

  <div class="pin hidden" id="pinBox">
    <label for="pin">PIN kasir</label>
    <p>Masukkan PIN sekali di perangkat ini. Setelah itu kasir cukup ketik nomor HP member.</p>
    <div class="row">
      <div class="field">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <input id="pin" type="password" inputmode="numeric" placeholder="••••••" autocomplete="off">
      </div>
      <button class="btn" type="button" id="pinBtn">Masuk</button>
    </div>
    <div class="err" id="pinErr"></div>
  </div>

  <div class="search hidden" id="form">
    <label for="q">Nomor HP member</label>
    <p>Ketik nomor yang disebutkan customer. Format 08…, 8…, 62… atau +62… semuanya bisa.</p>
    <div class="row">
      <div class="field">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>
        <input id="q" type="tel" inputmode="tel" placeholder="0812 xxxx xxxx" autocomplete="off">
      </div>
      <button class="btn" type="button" id="cekBtn">Cek Member</button>
    </div>
    <div class="hint"><kbd>Enter</kbd> untuk cek &nbsp;·&nbsp; <kbd>Esc</kbd> untuk kosongkan</div>
  </div>

  <div id="result"></div>

  <footer>
    <span id="meta"></span>
    <button class="btn ghost hidden" type="button" id="logoutBtn">Keluar / ganti PIN</button>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
// ====== PENGATURAN ======
// Isi dengan URL Web App dari Google Apps Script (berakhiran /exec)
const API_URL = "";
// ========================
// Halaman ini TIDAK berisi data member. Data diambil satu per satu dari Google Sheet
// (private) lewat Apps Script, dan hanya bisa diakses dengan PIN kasir.

const PIN_KEY = "snapy_pin_v1";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let PIN = "";
try { PIN = localStorage.getItem(PIN_KEY) || ""; } catch(_) {}

function norm(v){
  let d = String(v ?? "").replace(/\D/g, "");
  if (d.startsWith("62")) d = d.slice(2);
  d = d.replace(/^0+/, "");
  return d ? "0" + d : "";
}
function pretty(p){ return String(p).replace(/^(\d{4})(\d{4})(\d+)$/, "$1-$2-$3"); }
function outletClass(o){
  const s = String(o || "").toLowerCase();
  if (s.includes("palem") || s.includes("palen")) return "tp";
  if (s.includes("pik")) return "pik";
  return "other";
}
function fmtDate(iso){
  if (!iso) return "-";
  const d = new Date(iso + "T00:00:00");
  return isNaN(d) ? iso : d.toLocaleDateString("id-ID", {day:"numeric", month:"long", year:"numeric"});
}
function address(a){ return (a || []).filter(Boolean).join(", ") || "-"; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2600); }

function card(m){
  const oc = outletClass(m.o);
  return `<article class="member">
    <div class="mtop">
      <div><h2 class="mname">${esc(m.n)}</h2><div class="mcode">${esc(m.k)}</div></div>
      <span class="badge ${oc}">Outlet ${esc(m.o || "-")}</span>
    </div>
    <dl>
      <dt>Outlet</dt><dd>${esc(m.o || "-")}</dd>
      <dt>Nama</dt><dd>${esc(m.n)}</dd>
      <dt>Nomor HP</dt><dd class="phone">${esc(pretty(m.p))}</dd>
      <dt>Alamat</dt><dd>${esc(address(m.a))}</dd>
      <dt>Member sejak</dt><dd>${esc(fmtDate(m.j))}</dd>
    </dl>
  </article>`;
}

async function api(params){
  const url = API_URL + "?" + new URLSearchParams(params).toString();
  const r = await fetch(url, {method:"GET", redirect:"follow"});
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function showPin(msg){
  $("#pinBox").classList.remove("hidden"); $("#form").classList.add("hidden");
  $("#logoutBtn").classList.add("hidden"); $("#result").innerHTML = "";
  $("#pinErr").textContent = msg || ""; $("#pin").value = ""; $("#pin").focus();
  $("#meta").textContent = "";
}
function showSearch(){
  $("#pinBox").classList.add("hidden"); $("#form").classList.remove("hidden");
  $("#logoutBtn").classList.remove("hidden");
  $("#meta").textContent = "Terhubung ke data member (Google Sheet)";
  $("#result").innerHTML = `<div class="empty"><div>Data member akan tampil di sini.</div></div>`;
  $("#q").focus();
}

async function login(){
  const pin = $("#pin").value.trim();
  if (!pin){ $("#pin").focus(); return; }
  $("#pinErr").textContent = "Memeriksa PIN…";
  try{
    const res = await api({action:"ping", pin});
    if (res.ok){
      PIN = pin; try { localStorage.setItem(PIN_KEY, pin); } catch(_) {}
      showSearch(); toast("PIN benar, siap dipakai");
    } else {
      $("#pinErr").textContent = res.error || "PIN salah";
    }
  }catch(err){ $("#pinErr").textContent = "Tidak bisa terhubung ke server. Cek koneksi internet."; }
}

let busy = false;
async function search(){
  if (busy) return;
  const q = norm($("#q").value);
  const box = $("#result");
  if (!q){ $("#q").focus(); return; }
  if (q.length < 9){ box.innerHTML = `<div class="status no">Nomor terlalu pendek <small>— minimal 9 digit</small></div>`; return; }
  busy = true;
  box.innerHTML = `<div class="loading"><div class="spin"></div>Mencari member…</div>`;
  try{
    const res = await api({action:"find", pin:PIN, phone:q});
    if (!res.ok){
      if (res.code === "PIN"){ try{localStorage.removeItem(PIN_KEY);}catch(_){}; PIN=""; showPin("PIN sudah tidak berlaku, masukkan PIN baru."); }
      else box.innerHTML = `<div class="status no">${esc(res.error || "Terjadi kesalahan")}</div>`;
    } else if (res.members && res.members.length){
      box.innerHTML = `<div class="status ok">✓ Member terdaftar <small>— berhak dapat promo</small></div>` + res.members.map(card).join("");
    } else {
      box.innerHTML = `<div class="status no">✕ Nomor ${esc(pretty(q))} tidak terdaftar <small>— bukan member Taman Palem / PIK</small></div>`;
    }
  }catch(err){
    box.innerHTML = `<div class="status no">Tidak bisa terhubung ke server <small>— cek koneksi internet, lalu coba lagi</small></div>`;
  }
  busy = false;
}

$("#pinBtn").addEventListener("click", login);
$("#pin").addEventListener("keydown", e => { if (e.key === "Enter" || e.keyCode === 13){ e.preventDefault(); login(); } });
$("#cekBtn").addEventListener("click", search);
$("#q").addEventListener("keydown", e => { if (e.key === "Enter" || e.keyCode === 13){ e.preventDefault(); search(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#form").classList.contains("hidden")){ $("#q").value = ""; $("#result").innerHTML = ""; $("#q").focus(); }
});
$("#logoutBtn").addEventListener("click", () => {
  if (!confirm("Keluar dari perangkat ini? PIN perlu dimasukkan lagi.")) return;
  try{localStorage.removeItem(PIN_KEY);}catch(_){}; PIN=""; showPin();
});

if (!API_URL){
  $("#result").innerHTML = `<div class="status no">Halaman belum terhubung ke Google Sheet <small>— isi API_URL di index.html</small></div>`;
} else if (PIN){ showSearch(); } else { showPin(); }
</script>
</body>
</html>
